packages:
  - apps/*
  - packages/*
  - infra/*

allowBuilds:
  cpu-features: true
  esbuild: true
  fallow: true
  msw: true
  protobufjs: true
  ssh2: true

catalog:
  "@cloudflare/opaque-ts": ^0.7.5
  "@expo/vector-icons": ^15.1.1
  "@hookform/resolvers": ^5.9.1
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.103.0
  "@testcontainers/postgresql": ^12.1.0
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@types/node": ^25.9.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": ^4.1.10
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: 1.0.0-beta.15-859cf75
  drizzle-orm: 1.0.0-beta.15-859cf75
  drizzle-seed: 1.0.0-beta.15-859cf75
  # Expo SDK 55 line — keep all on 55.0.x. The `overrides` below additionally
  # pin the transitive copies these drag in (catalog only governs direct deps).
  expo: ~56.0.15
  expo-blur: ~56.0.3
  expo-clipboard: ~56.0.4
  expo-constants: ~56.0.20
  expo-dev-client: ~56.0.22
  expo-font: ~56.0.7
  expo-haptics: ~56.0.3
  expo-image: ~56.0.11
  expo-linking: ~56.0.15
  expo-router: ~56.2.14
  expo-secure-store: ~56.0.4
  expo-splash-screen: ^56.0.12
  expo-sqlite: ~56.0.5
  expo-status-bar: ~56.0.4
  expo-symbols: ~56.0.6
  expo-web-browser: ~56.0.5
  fast-check: ^4.10.1
  lucide-react: ^1.46.0
  lucide-react-native: ^1.46.0
  oxlint: ^1.83.0
  oxlint-tsgolint: ^0.23.0
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: ^7.88.0
  react-icons: ^5.7.0
  react-native: 0.87.1
  react-native-keyboard-controller: ^1.22.5
  react-native-reanimated: 4.6.0
  react-native-safe-area-context: ~5.9.1
  react-native-svg: 15.15.5
  react-native-worklets: ^0.12.2
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  testcontainers: ^12.1.0
  typescript: ~6.0.3
  uniwind: ^1.12.0
  vite: 8.3.0
  vitest: ^4.1.10
  wouter: ^3.11.0
  zod: ^4.6.5

blockExoticSubdeps: true
trustPolicy: no-downgrade
# Known false positives: published without provenance after earlier versions had it.
trustPolicyExclude:
  - semver@6.3.1
  - ua-parser-js@1.0.41

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@expo/cli@56.1.16"
  - "@expo/config-plugins@56.0.9"
  - "@expo/config-types@56.0.6"
  - "@expo/inline-modules@0.0.12"
  - "@expo/prebuild-config@56.0.16"
  - expo-font@56.0.7
  - expo-modules-autolinking@56.0.16
  - expo-modules-core@56.0.17
  - expo-modules-jsi@56.0.10
  - expo@56.0.12
  - "@expo/ui@56.0.18"
  - expo-router@56.2.11

nodeLinker: hoisted

onlyBuiltDependencies:
  - cpu-features
  - fallow
  - protobufjs
  - sharp
  - ssh

overrides:
  # lightningcss: "1.30.1"
  # reanimated 4.4.x (RN 0.86) requires worklets 0.9.x (see compatibility.json).
  # Without this pin an older copy hoists to the root and RNReanimated.podspec
  # fails worklets version validation during prebuild.
  # react-native-worklets: "0.9.2"
  # Expo's loose peer ranges (and @repo/ui-native's `expo-router: "*"` peer) let
  # pnpm resolve SDK 56 copies of these into an SDK 55 app, dragging in the SDK 56
  # expo-modules-core ABI -> native NoSuchMethodError (SharedRef / AnyTypeCache).
  # Pin every expo package to the SDK 55 line.
  # expo-router: "~55.0.15"
  # expo-font: "~56.0.6"
  # expo-image: "~56.0.11"
  # expo-symbols: "~56.0.6"
  # expo-glass-effect: "~55.0.11"
  # "@expo/ui": "~55.0.17"
  "@expo/metro-runtime": "56.0.16"
  "@expo/dom-webview": "56.0.5"
  "@react-native/metro-config": "0.85.3"
  react-dom: "19.3.0"

patchedDependencies:
  react-native-argon2: patches/react-native-argon2.patch
