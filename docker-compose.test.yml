# Mirrors the production hardening (docker-compose.prod.yml), so E2E runs the images as deployed.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-db-capabilities: &db-capabilities
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

services:
  web:
    <<: *hardened
    read_only: true
    tmpfs: [/data, /config]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SERVER_URL: /trpc
        VITE_DEMO_MODE: "false"
    image: passmgr-web:test
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - server

  server:
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    build:
      context: .
      dockerfile: Dockerfile.server
    image: passmgr-server:test
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://passmgr_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-passmgr}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPAQUE_OPRF_SEED: ${OPAQUE_OPRF_SEED}
      OPAQUE_AKE_PRIVATE_KEY: ${OPAQUE_AKE_PRIVATE_KEY}
      SERVER_DATA_KEY: ${SERVER_DATA_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      REGISTRATION_DISABLED: ${REGISTRATION_DISABLED:-false}
      RATE_LIMIT_DISABLED: "true"
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: passmgr <noreply@passmgr.test>
      PREFIX: /trpc
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})\""]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  migrate:
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    image: passmgr-server:test
    command: ["bun", "packages/db/migrate.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://passmgr:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-passmgr}
      APP_DB_USER: passmgr_app
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"

  postgres:
    <<: [*hardened, *db-capabilities]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: passmgr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-passmgr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passmgr"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    <<: [*hardened, *db-capabilities]
    read_only: true
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # The password goes in as config on stdin, never on the command line (visible in ps); the image's
    # entrypoint drops to the redis user.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - <<EOF
        requirepass "$$REDIS_PASSWORD"
        EOF
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

# Named volumes: the root filesystems are read-only. `down -v` (E2E global setup) resets them.
volumes:
  postgres_data:
  redis_data:
