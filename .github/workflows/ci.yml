name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by release.yml to gate deploys.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Dependabot bumps the image; CI must test the Bun that ships.
      - name: Dockerfile.server uses the Bun in .bun-version
        run: |
          bun_version=$(cat .bun-version)
          if [ "$(grep -c "^FROM oven/bun:${bun_version}\(-slim\)\?@" Dockerfile.server)" != 2 ]; then
            echo "::error::Dockerfile.server's oven/bun images differ from .bun-version (${bun_version})"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod --audit-level=high

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:integration

      - run: pnpm --filter @repo/store exec playwright install --with-deps chromium

      - run: pnpm test:browser

      - run: pnpm build
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
