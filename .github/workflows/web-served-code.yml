name: Web served code

# Compares what production serves against the release's published SHA256SUMS (see
# docs/security/web-served-code-trust.md). Only catches untargeted swaps: a host serving bad code
# to chosen victims passes a check from CI.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # release.yml, right after deploy: only that tag counts, no previous-release fallback.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      # Lets a caller that runs on push (release.yml) open the alert issue; other pushes never do.
      alert:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.verify.outputs.kind }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/web/scripts/verify-deployment.ts
            .bun-version
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The sums always come from the GitHub release, never from the site being checked.
      - name: Verify served files
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          TAG: ${{ inputs.tag }}
          # verify-deployment.ts EXIT_CODES (its test fails on drift); any other failure is "error".
          EXIT_MISMATCH: 1
          EXIT_UNREACHABLE: 3
        run: |
          # Anything that fails before a comparison (setup, gh, the script itself) reports "error".
          kind=error
          trap 'echo "kind=${kind}" >> "$GITHUB_OUTPUT"' EXIT

          if [ -z "$SITE_URL" ]; then
            echo "::error::vars.SITE_URL is not set"
            exit 1
          fi

          if [ -n "$TAG" ]; then
            candidates=("$TAG")
          else
            release_tags=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq \
              '[.[] | select((.draft | not) and any(.assets[]; .name == "passmgr-web.SHA256SUMS")) | .tag_name] | .[0:2] | .[]')
            if [ -z "$release_tags" ]; then
              echo "::error::No release has passmgr-web.SHA256SUMS"
              exit 1
            fi
            mapfile -t releases <<< "$release_tags"
            candidates=("${releases[0]}")
            # While the latest release's run is deploying, production still serves the previous
            # release; after a failed run (rolled back) too, but only for a day, so a host can't
            # silently downgrade production for good.
            release_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event push \
              --branch "${releases[0]}" --limit 1 --json status,conclusion,updatedAt --jq '.[0] |
                if . == null then "none"
                elif .status != "completed" then "running"
                elif .conclusion == "success" then "success"
                elif now - (.updatedAt | fromdateiso8601) < 86400 then "failed"
                else "failed long ago" end')
            if { [ "$release_run" = "running" ] || [ "$release_run" = "failed" ]; } && [ "${#releases[@]}" -gt 1 ]; then
              candidates+=("${releases[1]}")
            fi
          fi

          # The tag's Caddyfile holds the security headers the site must send (CSP, COOP, COEP).
          for tag in "${candidates[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern passmgr-web.SHA256SUMS --dir "sums/$tag"
            gh api -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/Caddyfile?ref=${tag}" > "sums/$tag/Caddyfile"
          done

          # Two attempts so one network hiccup doesn't page anyone. A mismatch once every candidate
          # mismatched in one attempt; else an error if one ran into one; else unreachable.
          kind=unreachable
          errored=false
          for attempt in 1 2; do
            all_mismatched=true
            for tag in "${candidates[@]}"; do
              echo "Checking ${SITE_URL} against ${tag}"
              status=0
              bun apps/web/scripts/verify-deployment.ts "$SITE_URL" "sums/$tag/passmgr-web.SHA256SUMS" "sums/$tag/Caddyfile" || status=$?
              if [ "$status" -eq 0 ]; then
                if [ "$tag" != "${candidates[0]}" ]; then
                  echo "::warning::${SITE_URL} serves ${tag}; ${candidates[0]} is not deployed yet (release run: ${release_run:-none})"
                fi
                echo "${SITE_URL} serves ${tag}" >> "$GITHUB_STEP_SUMMARY"
                kind=pass
                exit 0
              fi
              [ "$status" -ne "$EXIT_MISMATCH" ] && all_mismatched=false
              [ "$status" -ne "$EXIT_MISMATCH" ] && [ "$status" -ne "$EXIT_UNREACHABLE" ] && errored=true
            done
            [ "$all_mismatched" = true ] && kind=mismatch
            [ "$attempt" -eq 1 ] && sleep 60
          done
          [ "$kind" != mismatch ] && [ "$errored" = true ] && kind=error

          echo "::error::${SITE_URL} matches none of: ${candidates[*]} (${kind})"
          exit 1

      # Marks the run for the next ones' alert: only runs with this step succeeded count as unreachable.
      - name: Mark unreachable run
        if: failure() && steps.verify.outputs.kind == 'unreachable'
        run: echo "Unreachable"

  # A failed scheduled run alone only notifies whoever last edited the cron, so keep an open issue.
  # Mismatch and error open it at once, unreachable after UNREACHABLE_RUNS unreachable runs in a row.
  alert:
    needs: verify
    if: failure() && (github.event_name != 'push' || inputs.alert)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ needs.verify.outputs.kind }}
          EVENT: ${{ github.event_name }}
          # Hourly cron: three runs is about two hours without reaching the site.
          UNREACHABLE_RUNS: 3
          UNREACHABLE_STEP: Mark unreachable run
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$KIND" = "unreachable" ]; then
            title="Served-code check could not reach production"
            body=$(cat <<EOF
          The served-code check could not reach production (network error, timeout or HTTP 5xx) in ${UNREACHABLE_RUNS} scheduled runs in a row: ${run_url}

          No file was compared, so this is not by itself evidence of tampering. A host that keeps failing only some files of the release still needs explaining. See docs/security/web-served-code-trust.md.
          EOF
            )
          elif [ "$KIND" = "mismatch" ]; then
            title="Served web code does not match the release"
            body=$(cat <<EOF
          The files served by production don't match the published SHA256SUMS: ${run_url}

          Treat it as a possible web-host compromise until explained. See docs/security/web-served-code-trust.md.
          EOF
            )
          else
            # "error", or no kind at all: at least one candidate release was never compared.
            title="Served-code check could not complete"
            body=$(cat <<EOF
          The served-code check could not complete the comparison against every candidate release (configuration, GitHub API or script error): ${run_url}

          What failed compared nothing, so it is not by itself evidence of tampering; a candidate that was compared and did not match shows in the run log. Production is not fully checked until this is fixed. See docs/security/web-served-code-trust.md.
          EOF
            )
          fi

          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "\"${title}\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Still failing: ${run_url}"
            exit 0
          fi

          if [ "$KIND" = "unreachable" ]; then
            if [ "$EVENT" != "schedule" ]; then
              echo "::notice::Unreachable outside a scheduled run: no issue"
              exit 0
            fi
            # This run is still in progress, so the completed ones are the runs before it. Any run that
            # was not unreachable (pass, mismatch, error, cancelled) breaks the streak.
            earlier=$((UNREACHABLE_RUNS - 1))
            run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-served-code.yml --event schedule \
              --status completed --limit "$earlier" --json databaseId --jq '.[].databaseId')
            unreachable=0
            for id in $run_ids; do
              marked=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "verify")
                | .steps[] | select(.name == $ENV.UNREACHABLE_STEP and .conclusion == "success")] | length')
              [ "$marked" -gt 0 ] || break
              unreachable=$((unreachable + 1))
            done
            if [ "$unreachable" -lt "$earlier" ]; then
              echo "::notice::Unreachable, but not ${UNREACHABLE_RUNS} unreachable scheduled runs in a row yet: no issue"
              exit 0
            fi
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
