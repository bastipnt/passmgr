services:
  postgres_pass_mgr:
    image: "postgres:latest"
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    # Dev only. Defaults match DATABASE_URL in apps/server/.env; override from the shell if needed.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-passmgr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-passmgr123}
      - POSTGRES_DB=${POSTGRES_DB:-passmgr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_pass_mgr_data:/var/lib/postgresql

  mailpit:
    image: "axllent/mailpit:latest"
    restart: always
    ports:
      - 1025:1025
      - 8025:8025

  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080

volumes:
  postgres_pass_mgr_data: {}
