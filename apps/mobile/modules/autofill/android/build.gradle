plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.passmgr.autofill'
version = '1.0.0'

android {
  namespace "com.passmgr.autofill"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
  implementation "androidx.core:core-ktx:1.17.0"
}
