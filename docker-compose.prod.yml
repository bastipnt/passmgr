services:
  web:
    image: ghcr.io/${GHCR_OWNER}/passmgr-web:${IMAGE_TAG:-latest}
    # The host Caddy (caddy-docker-proxy) terminates TLS and proxies here over
    # caddy_network; no host port is published.
    labels:
      caddy: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000"
    networks:
      - caddy_network
      - passmgr_network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    image: ghcr.io/${GHCR_OWNER}/passmgr-server:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=postgres://passmgr:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-passmgr}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPAQUE_OPRF_SEED=${OPAQUE_OPRF_SEED:?OPAQUE_OPRF_SEED is required}
      - OPAQUE_AKE_PRIVATE_KEY=${OPAQUE_AKE_PRIVATE_KEY:?OPAQUE_AKE_PRIVATE_KEY is required}
      - OPAQUE_SERVER_IDENTITY=${OPAQUE_SERVER_IDENTITY:-passmgr}
      - OPAQUE_SERVER_SETUP=${OPAQUE_SERVER_SETUP:?OPAQUE_SERVER_SETUP is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${PUBLIC_HOSTNAME}}
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Proxy hops in front of the server: web Caddy + host Caddy.
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - PREFIX=/trpc
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/trpc/appConfig.getConfig').then(r=>{if(!r.ok)process.exit(1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations run on start.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - passmgr_network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=passmgr
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-passmgr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passmgr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - passmgr_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - passmgr_network
    restart: unless-stopped

networks:
  caddy_network:
    external: true
  passmgr_network:

volumes:
  postgres_data:
  redis_data:
