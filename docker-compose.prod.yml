# Every service: no privilege gain through setuid binaries or file capabilities, and only the
# capabilities it needs (postgres / redis start as root to chown their data, then drop to their user).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-db-capabilities: &db-capabilities
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

services:
  web:
    <<: *hardened
    read_only: true
    tmpfs: [/data, /config]
    # CI deploys by digest (infra/deploy/remote-deploy.sh); the tag only names it.
    image: ghcr.io/${GHCR_OWNER}/passmgr-web:${IMAGE_TAG:-latest}${WEB_DIGEST:+@${WEB_DIGEST}}
    # The host Caddy (caddy-docker-proxy) terminates TLS and proxies here over
    # caddy_network; no host port is published.
    labels:
      caddy: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000"
    networks:
      - caddy_network
      - passmgr_network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    # Set here, not only in the image: a rollback to an image from before the migrate step would
    # otherwise migrate on start as passmgr_app and fail.
    command: ["bun", "run", "apps/server/index.ts"]
    image: ghcr.io/${GHCR_OWNER}/passmgr-server:${IMAGE_TAG:-latest}${SERVER_DIGEST:+@${SERVER_DIGEST}}
    environment:
      # passmgr_app reads and writes data only; the schema belongs to passmgr (`migrate` below).
      - DATABASE_URL=postgres://passmgr_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-passmgr}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - OPAQUE_OPRF_SEED=${OPAQUE_OPRF_SEED:?OPAQUE_OPRF_SEED is required}
      - OPAQUE_AKE_PRIVATE_KEY=${OPAQUE_AKE_PRIVATE_KEY:?OPAQUE_AKE_PRIVATE_KEY is required}
      - SERVER_DATA_KEY=${SERVER_DATA_KEY:-${OPAQUE_SERVER_SETUP:?SERVER_DATA_KEY is required}}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${PUBLIC_HOSTNAME}}
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Any SMTP server works; with the bundled Stalwart (profile "mail") see docs/ops/email.md.
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Proxies in front of the server (web Caddy + host Caddy) sit on Docker
      # bridge networks, i.e. private ranges.
      - TRUST_PROXY=${TRUST_PROXY:-loopback,uniquelocal}
      - PREFIX=/trpc
      # Mobile releases still in use, comma-separated (e.g. v1.3.0,v1.2.1); crash reports
      # from other versions count as "other". The server's own release is always known.
      - CLIENT_VERSIONS=${CLIENT_VERSIONS:-}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      passmgr_network:
      mail_network:
      # The monitoring stack scrapes /metrics and checks /health on port 3001
      # (OPS_PORT, docs/ops/monitoring.md); the public proxy only reaches 3000.
      passmgr_metrics_network:
        aliases: [passmgr-server]
    restart: unless-stopped

  # One-shot, as the database owner: infra/deploy/remote-deploy.sh runs it with `compose run` before
  # each rollout. Also (re)grants passmgr_app, so tables a migration adds are covered.
  migrate:
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    image: ghcr.io/${GHCR_OWNER}/passmgr-server:${IMAGE_TAG:-latest}${SERVER_DIGEST:+@${SERVER_DIGEST}}
    profiles: [migrate]
    command: ["bun", "packages/db/migrate.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://passmgr:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-passmgr}
      - APP_DB_USER=passmgr_app
      - APP_DB_PASSWORD=${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - passmgr_network

  postgres:
    <<: [*hardened, *db-capabilities]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=passmgr
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-passmgr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passmgr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - passmgr_network
    restart: unless-stopped

  redis:
    <<: [*hardened, *db-capabilities]
    read_only: true
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # Redis holds live session authKeys: without a password anything on the
    # network could read them and sign requests as any user.
    # The password goes in as config on stdin, never on the command line (visible in ps); the image's
    # entrypoint drops to the redis user.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - <<EOF
        requirepass "$$REDIS_PASSWORD"
        EOF
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - passmgr_network
    restart: unless-stopped

  # Outgoing mail (verification codes), opt-in: COMPOSE_PROFILES=mail. Setup + DNS: docs/ops/email.md.
  # OPTIONAL: use Stalwart as email server
  # stalwart:
  #   image: stalwartlabs/stalwart:${STALWART_TAG:-latest}
  #   profiles: ["mail"]
  #   hostname: ${MAIL_HOSTNAME:-mail.${PUBLIC_HOSTNAME}}
  #   ports:
  #     - "25:25"
  #     - "465:465"
  #     # Admin UI: reach it through an SSH tunnel, never publicly.
  #     - "127.0.0.1:8081:8080"
  #   volumes:
  #     - stalwart_data:/opt/stalwart
  #   networks:
  #     - passmgr_network
  #   restart: unless-stopped

networks:
  caddy_network:
    external: true
  passmgr_network:
  mail_network:
    external: true
  passmgr_metrics_network:
    external: true

volumes:
  postgres_data:
  redis_data:
  # Comment in when using stalwart
  # stalwart_data:
